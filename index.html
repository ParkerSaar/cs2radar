<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Web Radar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;height:100vh;width:100vw;user-select:none;}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:20px;background:radial-gradient(ellipse at center,#12101a 0%,#0a0a0f 70%);}
#login-screen h1{font-size:28px;color:#00d4ff;letter-spacing:3px;text-transform:uppercase;}
#login-screen .subtitle{color:#666;font-size:14px;margin-top:-12px;}
#login-screen input{background:#16161e;border:2px solid #2a2a3a;color:#fff;padding:14px 24px;font-size:24px;text-align:center;letter-spacing:8px;text-transform:uppercase;border-radius:8px;outline:none;width:280px;transition:border-color 0.3s;}
#login-screen input:focus{border-color:#00d4ff;}
#login-screen input::placeholder{letter-spacing:2px;font-size:16px;color:#444;}
#login-screen button{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#fff;border:none;padding:12px 48px;font-size:16px;border-radius:8px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;letter-spacing:2px;}
#login-screen button:hover{background:linear-gradient(135deg,#00e5ff,#00aadd);transform:translateY(-1px);}
#login-screen .error{color:#ff4444;font-size:14px;min-height:20px;}
#radar-screen{display:none;width:100vw;height:100vh;position:relative;}
#radar-canvas{display:block;cursor:grab;}
#radar-canvas:active{cursor:grabbing;}
#top-bar{position:absolute;top:0;left:0;right:0;height:44px;background:rgba(12,12,18,0.95);border-bottom:1px solid #1e1e2e;display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;backdrop-filter:blur(10px);}
#top-bar .divider{width:1px;height:22px;background:#2a2a3a;}
#top-bar .status{font-size:12px;display:flex;align-items:center;gap:6px;}
#top-bar .status .dot{width:8px;height:8px;border-radius:50%;background:#ff4444;}
#top-bar .status .dot.connected{background:#44ff44;box-shadow:0 0 6px #44ff4466;}
#top-bar .info{font-size:12px;color:#666;}
#top-bar .code-display{font-size:13px;color:#00d4ff;font-family:'Consolas',monospace;letter-spacing:2px;}
.spacer{flex:1;}
.team-panel{position:absolute;top:44px;width:280px;bottom:40px;background:rgba(12,12,18,0.95);border:1px solid #1e1e2e;overflow-y:auto;z-index:100;backdrop-filter:blur(10px);padding:0;}
#t-panel{left:0;border-right:1px solid #1e1e2e;}
#ct-panel{right:0;border-left:1px solid #1e1e2e;}
.team-header{padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid #1e1e2e;font-weight:700;display:flex;align-items:center;gap:8px;}
#t-panel .team-header{color:#e8943a;background:rgba(232,148,58,0.08);}
#ct-panel .team-header{color:#5b9bd5;background:rgba(91,155,213,0.08);}
.team-header .team-money{font-size:11px;color:#888;margin-left:auto;font-weight:400;}
.player-card{padding:8px 10px;border-bottom:1px solid #141420;transition:background 0.2s;cursor:pointer;position:relative;}
.player-card:hover{background:rgba(255,255,255,0.03);}
.player-card.dead{opacity:0.4;}
.pc-row1{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.pc-name{font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc-money{font-size:11px;color:#6a4;font-family:'Consolas',monospace;}
.pc-row2{display:flex;align-items:center;gap:4px;margin-bottom:3px;}
.pc-hp-bar{flex:1;height:4px;background:#1a1a24;border-radius:2px;overflow:hidden;}
.pc-hp-fill{height:100%;border-radius:2px;transition:width 0.3s;}
.pc-armor-icon{font-size:11px;flex-shrink:0;}
#options-bar{position:absolute;bottom:0;left:280px;right:280px;height:40px;background:rgba(12,12,18,0.95);border-top:1px solid #1e1e2e;display:flex;align-items:center;padding:0 16px;gap:16px;z-index:100;backdrop-filter:blur(10px);overflow-x:auto;}
.opt-group{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.opt-group label{font-size:11px;color:#888;cursor:pointer;}
.opt-group input[type="checkbox"]{accent-color:#00d4ff;width:13px;height:13px;cursor:pointer;}
.opt-group select{background:#16161e;border:1px solid #2a2a3a;color:#ccc;padding:2px 6px;font-size:11px;border-radius:3px;outline:none;cursor:pointer;}
#bomb-panel{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(15,10,10,0.95);border:2px solid #ff3333;border-radius:10px;padding:12px 24px;z-index:200;display:none;text-align:center;min-width:200px;box-shadow:0 0 30px rgba(255,0,0,0.3);animation:bomb-pulse 1s infinite;}
@keyframes bomb-pulse{0%,100%{box-shadow:0 0 20px rgba(255,0,0,0.2);}50%{box-shadow:0 0 40px rgba(255,0,0,0.5);}}
.bomb-title{font-size:16px;font-weight:700;color:#ff4444;letter-spacing:2px;}
.bomb-site{font-size:24px;font-weight:700;color:#fff;margin:4px 0;}
.bomb-timer{font-size:32px;font-weight:700;font-family:'Consolas',monospace;}
.bomb-bar{width:100%;height:6px;background:#2a1515;border-radius:3px;margin-top:8px;overflow:hidden;}
.bomb-bar-fill{height:100%;border-radius:3px;transition:width 0.2s;}
#level-indicator{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(12,12,18,0.9);border:1px solid #00d4ff;border-radius:6px;padding:4px 16px;z-index:150;display:none;font-size:12px;font-weight:700;color:#00d4ff;letter-spacing:2px;}
#zoom-controls{position:absolute;bottom:50px;left:290px;display:flex;flex-direction:column;gap:4px;z-index:100;}
.zoom-btn{background:rgba(12,12,18,0.9);border:1px solid #2a2a3a;color:#aaa;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.zoom-btn:hover{border-color:#00d4ff;color:#fff;}
.notification{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,0.95);border:1px solid #00d4ff;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.notification.show{opacity:1;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:2px;}
@media(max-width:700px){.team-panel{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:35vh;border:none;border-top:1px solid #1e1e2e;}#t-panel{height:35vh;z-index:101;}#ct-panel{display:none;}#options-bar{display:none;}#zoom-controls{left:10px;bottom:calc(35vh + 10px);}.zoom-btn{width:40px;height:40px;font-size:20px;}}
</style>
</head>
<body>
<div id="login-screen">
    <h1>CS2 Radar</h1>
    <p class="subtitle">Enter your session code</p>
    <input type="text" id="code-input" placeholder="CODE" maxlength="6" autocomplete="off" spellcheck="false">
    <button onclick="doLogin()">Connect</button>
    <div class="error" id="login-error"></div>
</div>
<div id="radar-screen">
    <canvas id="radar-canvas"></canvas>
    <div id="top-bar">
        <span style="font-weight:700;color:#00d4ff;font-size:14px;">CS2 RADAR</span>
        <div class="divider"></div>
        <div class="status"><div class="dot" id="status-dot"></div><span id="status-text">Disconnected</span></div>
        <div class="divider"></div>
        <div class="code-display" id="code-display"></div>
        <div class="divider"></div>
        <div class="info" id="map-display">Map: --</div>
        <div class="spacer"></div>
        <div class="info" id="update-rate"></div>
    </div>
    <div class="team-panel" id="t-panel">
        <div class="team-header"><span>TERRORISTS</span><span class="team-money" id="t-total-money">$0</span></div>
        <div id="t-players"></div>
    </div>
    <div class="team-panel" id="ct-panel">
        <div class="team-header"><span>COUNTER-TERRORISTS</span><span class="team-money" id="ct-total-money">$0</span></div>
        <div id="ct-players"></div>
    </div>
    <div id="options-bar">
        <div class="opt-group"><label>Mode:</label><select id="opt-mode"><option value="centered">Centered</option><option value="static">Static</option></select></div>
        <div class="opt-group"><input type="checkbox" id="opt-rotate" checked><label for="opt-rotate">Rotate</label></div>
        <div class="opt-group"><input type="checkbox" id="opt-names" checked><label for="opt-names">Names</label></div>
        <div class="opt-group"><input type="checkbox" id="opt-hp-ring" checked><label for="opt-hp-ring">HP Ring</label></div>
    </div>
    <div id="bomb-panel">
        <div class="bomb-title">BOMB PLANTED</div>
        <div class="bomb-site" id="bomb-site">A</div>
        <div class="bomb-timer" id="bomb-timer">40.0</div>
        <div class="bomb-bar"><div class="bomb-bar-fill" id="bomb-bar-fill"></div></div>
    </div>
    <div id="level-indicator"></div>
    <div id="zoom-controls">
        <div class="zoom-btn" onclick="zoomIn()">+</div>
        <div class="zoom-btn" onclick="zoomOut()">-</div>
        <div class="zoom-btn" onclick="resetView()">R</div>
    </div>
    <div class="notification" id="notification"></div>
</div>
<script>
// =====================================================================
// CONFIG - CHANGE THIS TO YOUR CLOUDFLARE WORKER URL
// =====================================================================
const WORKER_URL = 'funny-cobra-88.parkersaar.deno.net';
// =====================================================================

const WS_URL = 'wss://' + WORKER_URL + '/ws/';
const RECONNECT_DELAY = 3000;

const MAP_DATA = {
    de_dust2: { pos_x: -2476, pos_y: 3239, scale: 4.4 },
    de_mirage: { pos_x: -3230, pos_y: 1713, scale: 5.0 },
    de_inferno: { pos_x: -2087, pos_y: 3870, scale: 4.9 },
    de_anubis: { pos_x: -2796, pos_y: 3328, scale: 5.22 },
    de_ancient: { pos_x: -2953, pos_y: 2164, scale: 5.0 },
    de_nuke: { pos_x: -3453, pos_y: 2887, scale: 7.0, levels: ['default', 'lower'], z_split: -495 },
    de_vertigo: { pos_x: -3168, pos_y: 1762, scale: 4.0, levels: ['default', 'lower'], z_split: 11700 },
    de_overpass: { pos_x: -4831, pos_y: 1781, scale: 5.2 },
    de_train: { pos_x: -2477, pos_y: 2392, scale: 4.7 },
    cs_office: { pos_x: -1838, pos_y: 1858, scale: 4.1 },
    cs_italy: { pos_x: -2647, pos_y: 2592, scale: 4.6 },
};

const C = { local: '#44ff44', t: '#e8943a', ct: '#5b9bd5', t_dead: '#8b5e25', ct_dead: '#3a6a8f' };
let ws = null, sessionCode = '', radarData = null, lastDataTime = 0;
let updateCount = 0, lastCountReset = Date.now();
let camX = 0, camY = 0, zoom = 1.0, dragging = false, dragSX = 0, dragSY = 0, dragCX = 0, dragCY = 0;
let canvas, ctx, W, H, currentMap = '', mapImages = {};

function notify(msg) { const el = document.getElementById('notification'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); }
function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function teamColor(t, dead) { if (dead) return t === 2 ? C.t_dead : C.ct_dead; return t === 2 ? C.t : t === 3 ? C.ct : '#888'; }

function loadMap(name) {
    if (!name || name === currentMap) return;
    currentMap = name;
    document.getElementById('map-display').textContent = 'Map: ' + name;
    mapImages = {};
    const md = MAP_DATA[name];
    if (!md) return;
    if (md.levels) {
        for (const lv of md.levels) {
            const img = new Image();
            const fname = lv === 'default' ? name : name + '_lower';
            img.onload = () => { mapImages[name + '_' + lv] = img; };
            img.src = '/data/' + fname + '/radar.png';
        }
    } else {
        const img = new Image();
        img.onload = () => { mapImages[name] = img; };
        img.src = '/data/' + name + '/radar.png';
    }
}

function getMapImage() {
    const md = MAP_DATA[currentMap];
    if (!md) return null;
    if (md.levels) {
        const lv = (radarData && radarData.level) || 'default';
        return mapImages[currentMap + '_' + lv] || null;
    }
    return mapImages[currentMap] || null;
}

function worldToRadar(wx, wy) {
    const md = MAP_DATA[currentMap];
    if (!md) return [0, 0];
    return [(wx - md.pos_x) / md.scale, (md.pos_y - wy) / md.scale];
}

function radarToScreen(rx, ry) {
    const mode = document.getElementById('opt-mode').value;
    const rotate = document.getElementById('opt-rotate').checked;
    if (mode === 'centered' && radarData && radarData.local_player) {
        const lp = radarData.local_player;
        const [lrx, lry] = worldToRadar(lp.x, lp.y);
        let dx = rx - lrx, dy = ry - lry;
        if (rotate && lp.yaw !== undefined) {
            const a = -(lp.yaw - 90) * Math.PI / 180;
            dx = (rx - lrx) * Math.cos(a) - (ry - lry) * Math.sin(a);
            dy = (rx - lrx) * Math.sin(a) + (ry - lry) * Math.cos(a);
        }
        return [W / 2 + dx * zoom + camX, H / 2 + dy * zoom + camY];
    }
    return [rx * zoom + camX + W / 2 - 512 * zoom, ry * zoom + camY + 44];
}

function w2s(wx, wy) { const [rx, ry] = worldToRadar(wx, wy); return radarToScreen(rx, ry); }

function doLogin() {
    const code = document.getElementById('code-input').value.trim().toUpperCase();
    if (code.length < 4) { document.getElementById('login-error').textContent = 'Code too short'; return; }
    sessionCode = code;
    document.getElementById('login-error').textContent = 'Connecting...';
    connectWS();
}
document.getElementById('code-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function connectWS() {
    if (ws && ws.readyState <= 1) ws.close();
    ws = new WebSocket(WS_URL);
    ws.onopen = () => { ws.send(JSON.stringify({ type: 'browser_auth', code: sessionCode })); };
    ws.onmessage = e => {
        let msg; try { msg = JSON.parse(e.data); } catch (x) { return; }
        if (msg.type === 'auth_ok') { showRadar(); setStatus(true, 'Connected'); notify('Connected'); }
        else if (msg.type === 'error') { document.getElementById('login-error').textContent = msg.msg || 'Error'; }
        else if (msg.type === 'radar_data') { radarData = msg.data; lastDataTime = Date.now(); updateCount++; if (msg.data.map && msg.data.map !== currentMap) loadMap(msg.data.map); }
        else if (msg.type === 'lua_disconnected') { setStatus(false, 'Game disconnected'); notify('Game disconnected'); }
        else if (msg.type === 'lua_connected') { setStatus(true, 'Live'); notify('Game connected'); }
    };
    ws.onclose = () => { setStatus(false, 'Disconnected'); if (sessionCode) setTimeout(connectWS, RECONNECT_DELAY); };
}

function setStatus(on, t) { document.getElementById('status-dot').className = 'dot' + (on ? ' connected' : ''); document.getElementById('status-text').textContent = t; }
function showRadar() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('radar-screen').style.display = 'block';
    document.getElementById('code-display').textContent = sessionCode;
    initCanvas();
    requestAnimationFrame(renderLoop);
}

function initCanvas() {
    canvas = document.getElementById('radar-canvas'); ctx = canvas.getContext('2d');
    resizeCanvas(); window.addEventListener('resize', resizeCanvas);
    canvas.addEventListener('mousedown', e => { if (e.button === 0) { dragging = true; dragSX = e.clientX; dragSY = e.clientY; dragCX = camX; dragCY = camY; } });
    window.addEventListener('mousemove', e => { if (dragging) { camX = dragCX + (e.clientX - dragSX); camY = dragCY + (e.clientY - dragSY); } });
    window.addEventListener('mouseup', () => { dragging = false; });
    canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(0.1, Math.min(10, zoom * (e.deltaY < 0 ? 1.12 : 0.89))); });
    canvas.addEventListener('dblclick', () => { camX = 0; camY = 0; });
}
function resizeCanvas() { W = window.innerWidth; H = window.innerHeight; canvas.width = W; canvas.height = H; }
function zoomIn() { zoom = Math.min(10, zoom * 1.2); }
function zoomOut() { zoom = Math.max(0.1, zoom * 0.83); }
function resetView() { camX = 0; camY = 0; zoom = 1.0; }

function drawHPRing(cx, cy, r, hp) {
    if (!document.getElementById('opt-hp-ring').checked) return;
    let col = hp > 66 ? '#44ff44' : hp > 33 ? '#ffcc00' : '#ff3333';
    ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(40,40,40,0.6)'; ctx.lineWidth = 2.5; ctx.stroke();
    const sa = -Math.PI / 2, ea = sa + Math.PI * 2 * (hp / 100);
    ctx.beginPath(); ctx.arc(cx, cy, r + 3, sa, ea); ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
}

function drawPlayer(p, isLocal) {
    const [sx, sy] = w2s(p.x, p.y);
    if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) return;
    const showN = document.getElementById('opt-names').checked;
    const tc = isLocal ? C.local : teamColor(p.team, !p.alive);
    const dotR = isLocal ? 10 : 7;

    if (!p.alive) {
        ctx.strokeStyle = tc; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(sx - 6, sy - 6); ctx.lineTo(sx + 6, sy + 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx + 6, sy - 6); ctx.lineTo(sx - 6, sy + 6); ctx.stroke();
        if (showN) { ctx.fillStyle = '#555'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'center'; ctx.fillText(p.name || '', sx, sy - 12); }
        return;
    }

    // Direction
    if (p.yaw !== undefined) {
        const mode = document.getElementById('opt-mode').value;
        const rotate = document.getElementById('opt-rotate').checked;
        let displayYaw = p.yaw;
        if (mode === 'centered' && rotate && radarData && radarData.local_player) displayYaw = p.yaw - radarData.local_player.yaw;
        const a = -displayYaw * Math.PI / 180;
        const ll = isLocal ? 35 : 25;
        ctx.strokeStyle = tc; ctx.lineWidth = isLocal ? 2.5 : 1.5; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a) * ll, sy + Math.sin(a) * ll); ctx.stroke();
        ctx.globalAlpha = 1;
    }

    drawHPRing(sx, sy, dotR, p.health || 100);
    if (isLocal) { ctx.fillStyle = tc; ctx.globalAlpha = 0.15; ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
    ctx.fillStyle = tc; ctx.beginPath(); ctx.arc(sx, sy, dotR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    if (showN) { ctx.fillStyle = tc; ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'center'; ctx.fillText(p.name || '', sx, sy - dotR - 8); }
}

function drawMapBg() {
    const img = getMapImage();
    if (img) {
        const sz = 1024;
        const [x0, y0] = radarToScreen(0, 0);
        const [x1, y1] = radarToScreen(sz, sz);
        ctx.globalAlpha = 0.5; ctx.drawImage(img, x0, y0, x1 - x0, y1 - y0); ctx.globalAlpha = 1;
    }
    const md = MAP_DATA[currentMap];
    if (md && md.levels) {
        const lv = (radarData && radarData.level) || 'default';
        const el = document.getElementById('level-indicator');
        el.textContent = lv === 'default' ? 'UPPER' : 'LOWER';
        el.style.display = 'block';
    } else {
        document.getElementById('level-indicator').style.display = 'none';
    }
}

function updateTeamPanels() {
    if (!radarData) return;
    const tP = [], ctP = [];
    const all = [...(radarData.players || [])];
    if (radarData.local_player) all.push({ ...radarData.local_player, isLocal: true });
    for (const p of all) { if (p.team === 2) tP.push(p); else if (p.team === 3) ctP.push(p); }
    renderPanel('t-players', tP, C.t);
    renderPanel('ct-players', ctP, C.ct);
    document.getElementById('t-total-money').textContent = '$' + tP.reduce((s, p) => s + (p.money || 0), 0).toLocaleString();
    document.getElementById('ct-total-money').textContent = '$' + ctP.reduce((s, p) => s + (p.money || 0), 0).toLocaleString();
}

function renderPanel(id, players, color) {
    const el = document.getElementById(id);
    players.sort((a, b) => { if (a.alive !== b.alive) return a.alive ? -1 : 1; return (a.name || '').localeCompare(b.name || ''); });
    let html = '';
    for (const p of players) {
        const dead = p.alive ? '' : ' dead';
        let hpC = '#44ff44'; if ((p.health || 0) <= 33) hpC = '#ff3333'; else if ((p.health || 0) <= 66) hpC = '#ffcc00';
        let armorI = p.armor_type === 2 ? '🛡H' : p.armor_type === 1 ? '🛡' : '';
        let defI = p.has_defuser ? '🔧' : '';
        html += '<div class="player-card' + dead + '"><div class="pc-row1"><div class="pc-name" style="color:' + (p.isLocal ? C.local : color) + '">' + escapeHtml(p.name || 'Unknown') + '</div><div class="pc-money">$' + (p.money || 0).toLocaleString() + '</div><span class="pc-armor-icon">' + armorI + defI + '</span></div><div class="pc-row2"><div class="pc-hp-bar"><div class="pc-hp-fill" style="width:' + (p.health || 0) + '%;background:' + hpC + '"></div></div></div></div>';
    }
    el.innerHTML = html;
}

function updateBomb() {
    const panel = document.getElementById('bomb-panel');
    if (!radarData || !radarData.bomb) { panel.style.display = 'none'; return; }
    const b = radarData.bomb;
    panel.style.display = 'block';
    document.getElementById('bomb-site').textContent = 'SITE ' + b.site;
    const [bx, by] = w2s(b.x, b.y);
    if (bx > -50 && bx < W + 50 && by > -50 && by < H + 50) {
        ctx.fillStyle = 'rgba(255,50,50,0.4)'; ctx.beginPath(); ctx.arc(bx, by, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    }
}

function renderLoop() { render(); requestAnimationFrame(renderLoop); }

function render() {
    if (!ctx) return;
    const now = Date.now();
    if (now - lastCountReset > 1000) { document.getElementById('update-rate').textContent = updateCount + ' upd/s'; updateCount = 0; lastCountReset = now; }
    const stale = now - lastDataTime > 3000;
    if (stale && lastDataTime > 0) setStatus(false, 'No data');
    else if (lastDataTime > 0) setStatus(true, 'Live');

    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, W, H);
    drawMapBg();
    if (!radarData) { ctx.fillStyle = '#333'; ctx.font = '16px Segoe UI'; ctx.textAlign = 'center'; ctx.fillText('Waiting for data...', W / 2, H / 2); return; }
    if (radarData.players) for (const p of radarData.players) drawPlayer(p, false);
    if (radarData.local_player) drawPlayer(radarData.local_player, true);
    updateBomb();
    updateTeamPanels();
}
</script>
</body>
</html>
