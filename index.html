<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Radar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; width: 100vw; user-select: none; }

#login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; background: linear-gradient(135deg, #0d0d12 0%, #1a1a24 100%); }
#login-screen h1 { font-size: 32px; color: #fff; letter-spacing: 4px; font-weight: 300; }
#login-screen h1 span { color: #4ade80; }
#login-screen input { background: #1a1a24; border: 1px solid #2a2a3a; color: #fff; padding: 16px 32px; font-size: 24px; text-align: center; letter-spacing: 8px; text-transform: uppercase; border-radius: 8px; outline: none; width: 300px; }
#login-screen input:focus { border-color: #4ade80; }
#login-screen button { background: #4ade80; color: #000; border: none; padding: 14px 48px; font-size: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; letter-spacing: 1px; }
#login-screen button:hover { background: #22c55e; }
#login-screen .error { color: #ff4444; font-size: 14px; min-height: 20px; }
#login-screen .status { color: #888; font-size: 12px; margin-top: 20px; }

#radar-screen { display: none; width: 100vw; height: 100vh; background: #0d0d12; }
.main-container { display: flex; height: 100vh; }

.team-panel { width: 280px; background: #111116; display: flex; flex-direction: column; overflow: hidden; }
.team-panel.ct-side { border-left: 1px solid #1e1e28; }
.team-panel.t-side { border-right: 1px solid #1e1e28; }
.team-header { padding: 12px 16px; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #1e1e28; }
.t-side .team-header { color: #e8943a; }
.ct-side .team-header { color: #5b9bd5; }
.players-list { flex: 1; overflow-y: auto; padding: 8px; }

.player-card { background: #16161c; border-radius: 6px; padding: 10px; margin-bottom: 6px; position: relative; }
.player-card.dead { opacity: 0.35; }
.player-card.local { background: #1a2420; border: 1px solid #4ade8040; }

.pc-row1 { display: flex; align-items: flex-start; gap: 10px; }
.pc-avatar { width: 56px; height: 56px; border-radius: 4px; background: #222; overflow: hidden; flex-shrink: 0; position: relative; }
.pc-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pc-status { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; }
.pc-status.alive { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
.pc-status.dead { background: #666; }

.pc-info { flex: 1; min-width: 0; }
.pc-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-side .pc-name { color: #e8943a; }
.ct-side .pc-name { color: #5b9bd5; }

.pc-money { font-size: 13px; color: #4ade80; font-weight: 600; margin-bottom: 6px; }

.pc-bars { display: flex; flex-direction: column; gap: 3px; }
.pc-bar { display: flex; align-items: center; gap: 6px; }
.pc-bar-icon { width: 14px; height: 14px; flex-shrink: 0; }
.pc-bar-icon img { width: 100%; height: 100%; filter: brightness(0) invert(1); opacity: 0.7; }
.pc-bar-track { flex: 1; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
.pc-bar-fill { height: 100%; border-radius: 2px; }
.pc-bar-fill.health { background: linear-gradient(90deg, #22c55e, #4ade80); }
.pc-bar-fill.armor { background: linear-gradient(90deg, #3b82f6, #5b9bd5); }
.pc-bar-value { font-size: 11px; width: 24px; text-align: right; color: #888; }

.pc-row2 { display: flex; gap: 3px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #222; flex-wrap: wrap; }
.pc-weapon { height: 20px; background: #1a1a22; border-radius: 3px; display: flex; align-items: center; justify-content: center; padding: 2px 6px; }
.pc-weapon.active { background: #2a3a2e; border: 1px solid #4ade8060; }
.pc-weapon img { height: 100%; width: auto; max-width: 48px; object-fit: contain; filter: brightness(0) invert(1); opacity: 0.85; }

.pc-row3 { display: flex; gap: 3px; margin-top: 4px; }
.pc-util { width: 18px; height: 18px; background: #1a1a22; border-radius: 3px; display: flex; align-items: center; justify-content: center; padding: 2px; }
.pc-util img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1); opacity: 0.7; }
.pc-util.defuser img { filter: brightness(0) invert(1) sepia(1) saturate(5) hue-rotate(180deg); }

.map-container { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.map-header { height: 44px; background: #111116; border-bottom: 1px solid #1e1e28; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
.map-left { display: flex; align-items: center; gap: 16px; }
.map-logo { font-size: 14px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
.map-logo svg { width: 20px; height: 20px; fill: #4ade80; }
.map-score { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.map-score .t-score { color: #e8943a; }
.map-score .ct-score { color: #5b9bd5; }
.map-center { display: flex; align-items: center; gap: 12px; }
.map-name { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; background: #1a1a24; padding: 5px 10px; border-radius: 4px; }
.map-right { display: flex; align-items: center; gap: 8px; }
.map-btn { background: #1a1a24; border: 1px solid #2a2a3a; color: #888; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 5px; }
.map-btn:hover { border-color: #4ade80; color: #fff; }
.map-btn.active { background: #4ade80; color: #000; border-color: #4ade80; }
.map-select { background: #1a1a24; border: 1px solid #2a2a3a; color: #ccc; padding: 5px 8px; border-radius: 4px; font-size: 11px; outline: none; cursor: pointer; }

.map-area { flex: 1; position: relative; overflow: hidden; background: #0a0a10; }
#radar-canvas { width: 100%; height: 100%; cursor: grab; display: block; }
#radar-canvas:active { cursor: grabbing; }
.map-label { position: absolute; top: 10px; left: 12px; font-size: 10px; color: #333; font-family: monospace; pointer-events: none; }

#bomb-indicator { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #dc2626, #b91c1c); padding: 10px 24px; border-radius: 6px; display: none; text-align: center; z-index: 100; box-shadow: 0 4px 20px rgba(220,38,38,0.4); }
#bomb-indicator .site { font-size: 12px; font-weight: 600; color: #fca5a5; letter-spacing: 2px; }
#bomb-indicator .timer { font-size: 28px; font-weight: 700; font-family: 'Consolas', monospace; color: #fff; }
#bomb-indicator.defusing { background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: 0 4px 20px rgba(37,99,235,0.4); }
#bomb-indicator.defusing .site { color: #93c5fd; }

.notification { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1a1a24; border: 1px solid #4ade80; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 12px; z-index: 9999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.notification.show { opacity: 1; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }
</style>
</head>
<body>

<div id="login-screen">
    <h1>Cloud <span>Radar</span></h1>
    <input type="text" id="code-input" placeholder="CODE" maxlength="6" autocomplete="off" spellcheck="false">
    <button onclick="doLogin()">CONNECT</button>
    <div class="error" id="login-error"></div>
    <div class="status">Enter the code shown in your game console</div>
</div>

<div id="radar-screen">
    <div class="main-container">
        <div class="team-panel t-side">
            <div class="team-header">Terrorists</div>
            <div class="players-list" id="t-players"></div>
        </div>
        <div class="map-container">
            <div class="map-header">
                <div class="map-left">
                    <div class="map-logo">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3"/></svg>
                        Cloud Radar
                    </div>
                    <div class="map-score"><span class="t-score" id="t-score">0</span><span style="color:#444"> : </span><span class="ct-score" id="ct-score">0</span></div>
                </div>
                <div class="map-center"><span class="map-name" id="map-name">WAITING</span></div>
                <div class="map-right">
                    <button class="map-btn active" id="btn-map" onclick="setView('map')">🗺 Map</button>
                    <button class="map-btn" id="btn-player" onclick="setView('player')">👤 Player</button>
                    <select class="map-select" id="follow-select" onchange="followTarget=this.value"></select>
                    <button class="map-btn" onclick="camX=camY=0;zoom=1">↺</button>
                    <button class="map-btn" onclick="location.reload()">← Back</button>
                </div>
            </div>
            <div class="map-area">
                <canvas id="radar-canvas"></canvas>
                <div class="map-label" id="map-label"></div>
                <div id="bomb-indicator"><div class="site" id="bomb-site">BOMB</div><div class="timer" id="bomb-timer">40.0</div></div>
            </div>
        </div>
        <div class="team-panel ct-side">
            <div class="team-header">Counter-Terrorists</div>
            <div class="players-list" id="ct-players"></div>
        </div>
    </div>
    <div class="notification" id="notification"></div>
</div>

<script>
const WS_URL = 'ws://216.250.112.68:8080';

const MAP_DATA = {
    de_dust2: { pos_x: -2476, pos_y: 3239, scale: 4.4 },
    de_mirage: { pos_x: -3230, pos_y: 1713, scale: 5.0 },
    de_inferno: { pos_x: -2087, pos_y: 3870, scale: 4.9 },
    de_anubis: { pos_x: -2796, pos_y: 3328, scale: 5.22 },
    de_ancient: { pos_x: -2953, pos_y: 2164, scale: 5.0 },
    de_nuke: { pos_x: -3453, pos_y: 2887, scale: 7.0 },
    de_vertigo: { pos_x: -3168, pos_y: 1762, scale: 4.0 },
    de_overpass: { pos_x: -4831, pos_y: 1781, scale: 5.2 },
    de_train: { pos_x: -2477, pos_y: 2392, scale: 4.7 },
    cs_office: { pos_x: -1838, pos_y: 1858, scale: 4.1 },
    cs_italy: { pos_x: -2647, pos_y: 2592, scale: 4.6 },
};

const CT_CHAR = 'ctm_sas';
const T_CHAR = 'tm_phoenix';
const GRENADES = ['flashbang','hegrenade','smokegrenade','molotov','incgrenade','decoy'];
const PISTOLS = ['glock','usp_silencer','hkp2000','p2000','p250','fiveseven','tec9','cz75a','deagle','revolver','elite'];

let ws = null, sessionCode = '', radarData = null;
let camX = 0, camY = 0, zoom = 1.0, dragging = false, dragX = 0, dragY = 0, dcX = 0, dcY = 0;
let canvas, ctx, W, H, currentMap = '', mapImg = null;
let viewMode = 'map', followTarget = '';

function notify(msg) { const el = document.getElementById('notification'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); }
function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadMap(name) {
    if (!name || name === currentMap) return;
    currentMap = name;
    document.getElementById('map-name').textContent = name.toUpperCase().replace(/_/g, ' ');
    document.getElementById('map-label').textContent = '//' + name;
    mapImg = null;
    const img = new Image();
    img.onload = () => { mapImg = img; };
    img.src = '/data/' + name + '/radar.png';
}

function w2r(wx, wy) {
    const md = MAP_DATA[currentMap];
    if (!md) return [0, 0];
    return [(wx - md.pos_x) / md.scale, (md.pos_y - wy) / md.scale];
}

function r2s(rx, ry) {
    if (viewMode === 'player' && radarData?.local_player) {
        const lp = followTarget ? (radarData.players?.find(p=>p.name===followTarget) || radarData.local_player) : radarData.local_player;
        const [lrx, lry] = w2r(lp.x, lp.y);
        let dx = rx - lrx, dy = ry - lry;
        const a = -(lp.yaw - 90) * Math.PI / 180;
        return [W/2 + (dx*Math.cos(a) - dy*Math.sin(a))*zoom + camX, H/2 + (dx*Math.sin(a) + dy*Math.cos(a))*zoom + camY];
    }
    return [rx*zoom + camX + W/2 - 512*zoom, ry*zoom + camY + 50];
}

function w2s(wx, wy) { const [rx, ry] = w2r(wx, wy); return r2s(rx, ry); }

function setView(mode) {
    viewMode = mode;
    document.getElementById('btn-map').classList.toggle('active', mode === 'map');
    document.getElementById('btn-player').classList.toggle('active', mode === 'player');
    camX = camY = 0; zoom = 1;
}

// LOGIN
function doLogin() {
    const code = document.getElementById('code-input').value.trim().toUpperCase();
    if (code.length < 4) { document.getElementById('login-error').textContent = 'Enter the code'; return; }
    sessionCode = code;
    document.getElementById('login-error').textContent = 'Connecting...';
    connectWS();
}
document.getElementById('code-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

let pendingData = null;

// WS
function connectWS() {
    if (ws?.readyState <= 1) ws.close();
    ws = new WebSocket(WS_URL);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'browser_auth', code: sessionCode }));
    ws.onmessage = e => {
        let msg; try { msg = JSON.parse(e.data); } catch { return; }
        if (msg.type === 'auth_ok') { showRadar(); notify('Connected'); }
        else if (msg.type === 'error') { document.getElementById('login-error').textContent = msg.msg || 'Error'; }
        else if (msg.type === 'radar_data') {
            radarData = msg.data;
            if (msg.data?.map && msg.data.map !== currentMap) loadMap(msg.data.map);
        }
        else if (msg.type === 'lua_disconnected') notify('Game disconnected');
        else if (msg.type === 'lua_connected') notify('Game connected');
    };
    ws.onclose = () => { if (sessionCode) setTimeout(connectWS, 3000); };
}

function showRadar() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('radar-screen').style.display = 'block';
    initCanvas();
    requestAnimationFrame(renderLoop);
}

// CANVAS
function initCanvas() {
    canvas = document.getElementById('radar-canvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    canvas.addEventListener('mousedown', e => { if (e.button === 0) { dragging = true; dragX = e.clientX; dragY = e.clientY; dcX = camX; dcY = camY; }});
    window.addEventListener('mousemove', e => { if (dragging) { camX = dcX + e.clientX - dragX; camY = dcY + e.clientY - dragY; }});
    window.addEventListener('mouseup', () => dragging = false);
    canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(0.3, Math.min(6, zoom * (e.deltaY < 0 ? 1.12 : 0.89))); });
    canvas.addEventListener('dblclick', () => { camX = camY = 0; zoom = 1; });
}

function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W; canvas.height = H;
}

// THROTTLED UI UPDATE - updates are cheap now, run every 500ms
function scheduleUIUpdate() {
    if (uiUpdateTimer) return;
    uiUpdateTimer = setTimeout(() => {
        uiUpdateTimer = null;
        updateUI();
    }, 500);
}

function getWeaponType(w) {
    if (!w) return null;
    w = w.toLowerCase();
    if (GRENADES.includes(w)) return 'grenade';
    if (PISTOLS.includes(w)) return 'pistol';
    if (w.includes('knife') || w === 'bayonet') return 'knife';
    return 'primary';
}

function getChar(team) {
    return '/characters/' + (team === 2 ? T_CHAR : CT_CHAR) + '.png';
}

function buildCard(p, isLocal) {
    const dead = p.alive ? '' : ' dead';
    const local = isLocal ? ' local' : '';
    const armorIcon = p.armor_type === 2 ? 'kevlar_helmet' : 'kevlar';
    const weapon = p.weapon || '';
    const defuser = p.has_defuser ? '<div class="pc-util defuser"><img src="/icons/defuser.svg"></div>' : '';
    const weaponHtml = (weapon && p.alive) ? `<div class="pc-weapon active"><img src="/icons/${weapon.toLowerCase()}.svg" onerror="this.parentElement.style.display='none'"></div>` : '';
    
    return `<div class="player-card${dead}${local}">
        <div class="pc-row1">
            <div class="pc-avatar"><img src="${getChar(p.team)}"><div class="pc-status ${p.alive?'alive':'dead'}"></div></div>
            <div class="pc-info">
                <div class="pc-name">${esc(p.name||'Unknown')}</div>
                <div class="pc-money">$${(p.money||0).toLocaleString()}</div>
                <div class="pc-bars">
                    <div class="pc-bar"><div class="pc-bar-icon"><img src="/icons/health.svg"></div><div class="pc-bar-track"><div class="pc-bar-fill health" style="width:${p.health||0}%"></div></div><div class="pc-bar-value">${p.health||0}</div></div>
                    <div class="pc-bar"><div class="pc-bar-icon"><img src="/icons/${armorIcon}.svg"></div><div class="pc-bar-track"><div class="pc-bar-fill armor" style="width:${p.armor||0}%"></div></div><div class="pc-bar-value">${p.armor||0}</div></div>
                </div>
            </div>
        </div>
        <div class="pc-row2">${weaponHtml}</div>
        <div class="pc-row3">${defuser}</div>
    </div>`;
}

function updateTeamPanels() {
    if (!radarData) return;
    
    const tPlayers = [];
    const ctPlayers = [];
    
    if (radarData.local_player) {
        const lp = radarData.local_player;
        if (lp.team === 2) tPlayers.push({ p: lp, local: true });
        else if (lp.team === 3) ctPlayers.push({ p: lp, local: true });
    }
    
    if (radarData.players) {
        for (const p of radarData.players) {
            if (p.team === 2) tPlayers.push({ p, local: false });
            else if (p.team === 3) ctPlayers.push({ p, local: false });
        }
    }
    
    // Sort: alive first
    const sortFn = (a, b) => (a.p.alive === b.p.alive ? 0 : (a.p.alive ? -1 : 1));
    tPlayers.sort(sortFn);
    ctPlayers.sort(sortFn);
    
    document.getElementById('t-players').innerHTML = tPlayers.map(x => buildCard(x.p, x.local)).join('');
    document.getElementById('ct-players').innerHTML = ctPlayers.map(x => buildCard(x.p, x.local)).join('');
}

function updateBomb() {
    const bombEl = document.getElementById('bomb-indicator');
    if (radarData?.bomb) {
        bombEl.style.display = 'block';
        bombEl.classList.toggle('defusing', radarData.bomb.defusing);
        document.getElementById('bomb-site').textContent = radarData.bomb.defusing ? 'DEFUSING' : 'SITE ' + radarData.bomb.site;
    } else {
        bombEl.style.display = 'none';
    }
}

// DRAW - runs every frame, but only touches canvas
function drawPlayer(p, isLocal) {
    const [sx, sy] = w2s(p.x, p.y);
    if (sx < -50 || sx > W+50 || sy < -50 || sy > H+50) return;
    
    const c = isLocal ? '#4ade80' : (p.team === 2 ? (p.alive ? '#e8943a' : '#8b5e25') : (p.alive ? '#5b9bd5' : '#3a6a8f'));
    
    if (!p.alive) {
        ctx.strokeStyle = c; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx-5, sy-5); ctx.lineTo(sx+5, sy+5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx+5, sy-5); ctx.lineTo(sx-5, sy+5); ctx.stroke();
        return;
    }
    
    // Direction
    if (p.yaw !== undefined) {
        let yaw = p.yaw;
        if (viewMode === 'player' && radarData?.local_player) {
            const follow = followTarget ? (radarData.players?.find(x=>x.name===followTarget) || radarData.local_player) : radarData.local_player;
            yaw = p.yaw - follow.yaw;
        }
        const a = -yaw * Math.PI / 180;
        ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a)*25, sy + Math.sin(a)*25); ctx.stroke();
        ctx.globalAlpha = 1;
    }
    
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(sx, sy, isLocal ? 10 : 8, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    
    ctx.fillStyle = c; ctx.font = 'bold 10px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText(p.name || '', sx, sy - (isLocal ? 14 : 12));
}

function render() {
    if (!ctx) return;
    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(0, 0, W, H);
    
    if (mapImg) {
        const [x0, y0] = r2s(0, 0);
        const [x1, y1] = r2s(1024, 1024);
        ctx.globalAlpha = 0.55;
        ctx.drawImage(mapImg, x0, y0, x1-x0, y1-y0);
        ctx.globalAlpha = 1;
    }
    
    if (!radarData) {
        ctx.fillStyle = '#444'; ctx.font = '14px Segoe UI'; ctx.textAlign = 'center';
        ctx.fillText('Waiting for game data...', W/2, H/2);
        return;
    }
    
    if (radarData.players) for (const p of radarData.players) drawPlayer(p, false);
    if (radarData.local_player) drawPlayer(radarData.local_player, true);
    
    // Bomb
    if (radarData.bomb) {
        const [bx, by] = w2s(radarData.bomb.x, radarData.bomb.y);
        if (bx > -50 && bx < W+50 && by > -50 && by < H+50) {
            ctx.fillStyle = 'rgba(255,60,60,0.3)';
            ctx.beginPath(); ctx.arc(bx, by, 14, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ff3333';
            ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI*2); ctx.fill();
        }
    }
    
    // Update DOM (like their code does)
    updateTeamPanels();
    updateBomb();
}

function renderLoop() { render(); requestAnimationFrame(renderLoop); }
</script>
</body>
</html>
